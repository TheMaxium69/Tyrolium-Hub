@if (!auth.ready()) {
  <div class="hub-boot">
    <tyro-ui-skeleton width="220px" height="10px" borderRadius="10px"></tyro-ui-skeleton>
  </div>
} @else if (auth.user()) {
  <tyro-ui-dashboard-layout
    [project]="PROJECT_NAME"
    [logo]="PROJECT_LOGO"
    [logoWhite]="PROJECT_LOGO_WHITE"
    [utility]="PROJECT_UTILITY"
    [navItems]="navItems()">
    <router-outlet />
  </tyro-ui-dashboard-layout>
  <tyro-ui-confirm-modal></tyro-ui-confirm-modal>
  <tyro-ui-snackbar></tyro-ui-snackbar>
} @else {
  <app-login />
}
